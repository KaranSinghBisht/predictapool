[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
ffi = true
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./"}]

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
xlayer_testnet = "https://testrpc.xlayer.tech"
xlayer_mainnet = "https://rpc.xlayer.tech"
localhost = "http://127.0.0.1:8545"
